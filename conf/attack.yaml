defaults:
  - paths: default
  - dataset: mnist
  - device: local
  - attack: fgsm
  - _self_

experiment_dir: ???
model_load: final
stride: 5

hydra:
  run:
    dir: ${LOGS_DIR}/attacks/${now:%Y-%m-%d@%H-%M-%S}
  sweep:
    dir: ${LOGS_DIR}/attacks/${now:%Y-%m-%d@%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - dataset
          - device
          - attack
          - experiment_dir
          - model_load
          - stride
          - DATA_DIR
          - LOGS_DIR
