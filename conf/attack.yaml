defaults:
  - device: local
  - qdevice: sim
  - dataset: mnist
  - attack: fgsm
  - logging: verbose
  - _self_

expdir: attacks # Experiment directory
DATA_DIR: ./data/processed
LOGS_DIR: ./logs

model_load: final
results_path: null
models_path: ???

hydra:
  run:
    dir: ${LOGS_DIR}/${expdir}/${now:%Y-%m-%d@%H-%M-%S}
  sweep:
    dir: ${LOGS_DIR}/${expdir}/${now:%Y-%m-%d@%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - dataset
          - device
          - attack
          - experiment_dir
          - model_load
          - DATA_DIR
          - LOGS_DIR
