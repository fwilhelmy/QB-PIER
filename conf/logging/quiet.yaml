# @package hydra.job_logging
version: 1
formatters:
  simple:
    format: "[%(asctime)s][%(name)s][%(levelname)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
handlers:
  file:
    class: logging.FileHandler
    formatter: simple
    filename: ${hydra.runtime.output_dir}/experiment.log
root:
  level: INFO
  handlers: [file]
disable_existing_loggers: false
