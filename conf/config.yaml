defaults:
  - training: dev
  - device: local
  - qdevice: sim
  - dataset: mnist
  - model: lenet
  - _self_

experiment_name: test_time

DATA_DIR: "./data/processed"
LOGS_DIR: "./logs"

hydra:
  run:
    dir: ${LOGS_DIR}/${experiment_name}/${now:%Y-%m-%d@%H-%M-%S}/${model.model_class}
  sweep:
    dir: ${LOGS_DIR}/${experiment_name}/${now:%Y-%m-%d@%H-%M-%S}/${model.model_class}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          # Keys excluded from Hydra's output directory structure
          - model
          - training
          - device
          - qdevice
          - dataset
          - experiment_name
          - DATA_DIR
          - LOGS_DIR
