# @package _global_

defaults:
  - override /model: vqm
  - override /training: full

exp_dir: optim_lr

model:
  n_qdepth: 50

training:
  epochs: 5000

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      ++training: "{optimiser:adam, optimiser.learning_rate:0.001},{optimiser:adam, optimiser.learning_rate:0.0003},{optimiser:adamw, optimiser.learning_rate:0.001},{optimiser:adamw, optimiser.learning_rate:0.0003},{optimiser:sgd},{optimiser:momentum}"
