# @package _global_

defaults:
  - override /model: vqm
  - override /training: mid

exp_dir: gs-vqm-batch

model:
  n_qdepth: 50

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      +training: "{dataset.train_batch_size:128, training.optimiser.learning_rate:0.000075},\
                 {dataset.train_batch_size:256, training.optimiser.learning_rate:0.00015},\
                 {dataset.train_batch_size:512, training.optimiser.learning_rate:0.0003},\
                 {dataset.train_batch_size:1024, training.optimiser.learning_rate:0.0006}"
