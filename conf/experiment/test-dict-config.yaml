# @package _global_

defaults:
  - override /model: vqm
  - override /training: full

exp_dir: optim_lr

model:
  n_qdepth: 50

training:
  n_steps: 5000

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      training: "{optimiser:{name:adam,learning_rate:0.001,optimiser_config:{weight_decay:0.0}}},{optimiser:{name:adam,learning_rate:0.0003,optimiser_config:{weight_decay:0.0}}},{optimiser:{name:adamw,learning_rate:0.001,optimiser_config:{weight_decay:0.01}}},{optimiser:{name:adamw,learning_rate:0.0003,optimiser_config:{weight_decay:0.01}}},{optimiser:{name:sgd,learning_rate:0.03,optimiser_config:{momentum:0.0,weight_decay:0.0005}}},{optimiser:{name:sgd,learning_rate:0.03,optimiser_config:{momentum:0.9,weight_decay:0.0005}}}"
