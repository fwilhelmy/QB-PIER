defaults:
  - device: local
  - qdevice: sim
  - dataset: mnist
  - model: lenet
  - training: dev
  - _self_

expdir: training # Experiment directory
DATA_DIR: ./data/processed
LOGS_DIR: ./logs

hydra:
  run:
    dir: ${LOGS_DIR}/${expdir}/${now:%Y-%m-%d@%H-%M-%S}/${model.model_class}
  sweep:
    dir: ${LOGS_DIR}/${expdir}/${now:%Y-%m-%d@%H-%M-%S}
    subdir: ${model.model_class}/${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          # Keys excluded from Hydra's output directory structure
          - training
          - device
          - qdevice
          - dataset
          - expdir
          - experiment
          - DATA_DIR
          - LOGS_DIR
          - training.seeds
