defaults:
  - device: local
  - qdevice: sim
  - dataset: mnist
  - model: lenet
  - training: dev
  - logging: verbose
  - _self_

expdir: lr_finder
DATA_DIR: ./data/processed
LOGS_DIR: ./logs

lr_finder:
  min_lr: 1.0e-06
  max_lr: 1.0
  num_training: 100
  mode: exponential
  early_stop_threshold: 4.0

hydra:
  run:
    dir: ${LOGS_DIR}/${expdir}/${now:%Y-%m-%d@%H-%M-%S}/${model.model_class}/lr_finder
  sweep:
    dir: ${LOGS_DIR}/${expdir}/${now:%Y-%m-%d@%H-%M-%S}
    subdir: ${model.model_class}/${hydra.job.override_dirname}/lr_finder
  job:
    config:
      override_dirname:
        exclude_keys:
          - training
          - device
          - qdevice
          - dataset
          - expdir
          - experiment
          - DATA_DIR
          - LOGS_DIR
          - training.seeds
          - lr_finder
