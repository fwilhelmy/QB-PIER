# environment.yaml

name: QAML

# Channels to search for packages
channels:
  - defaults
  - conda-forge
  - pytorch
  - NVIDIA

# List of dependencies to install
dependencies:
  # Python version
  - python=3.13

  # Base packages
  - anaconda
  - pip

  # Scientific computing and visualization
  - numpy
  - matplotlib

  # Optimization libraries
  - cvxpy

  # Machine learning and deep learning libraries
  - pytorch
  - torchvision
  - lightning

  # Quantum computing libraries
  - pennylane

  # Adversarial robustness libraries
  - adversarial-robustness-toolbox
  - adversarial-robustness-toolbox[pytorch_image]

  # Development tools
  - click
  - Sphinx
  - coverage
  - awscli
  - flake8
  - python-dotenv
