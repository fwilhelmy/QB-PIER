training:
  optimizer: adamw
  scheduler: dummy
  loss_fn: cross_entropy
  lr: 0.001
  momentum: 0.9
  weight_decay: 1.0
device:
  device: cuda
  accelerator: auto
  devices: 1
  num_workers: 0
  num_threads: null
qdevice:
  CIRCUIT_STYLE: pennylane
  QDEVICE: default.qubit
  INTERFACE: torch
  QDIFF: backprop
dataset:
  dataset: MNIST
  train_ratio: 0.6
  eval_ratio: 0.4
  train_batch_size: 512
  eval_batch_size: 4096
model:
  exp_name: AmpVQC_Strong_depth_4
  class_path: src.models.hybrid.AmpVQC
  params:
    input_size: 784
    n_qdepth: 4
    ansatz_cls: src.models.quantum.ansatzs.StrongEntanglingAnsatz
seeds:
- 0
- 42
verbose: false
train_log_interval: 0.5
eval_log_interval: 0.5
n_steps: 10001
