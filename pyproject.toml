[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qb-pier"
version = "0.2.0"
description = "Quantum Benchmarking Pipeline for Integrated Evaluation of Robustness"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [ {name = "Felix Wilhelmy"} ]
dependencies = [
    "pandas",
    "fastparquet",
    "numpy",
    "cvxpy",
    "pennylane",
    "torch",
    "torchvision",
    "lightning",
    "scikit-learn",
    "umap-learn",
    "tensorboard",
    "matplotlib",
    "discord-webhook"
]

[project.optional-dependencies]
docs = ["sphinx"]

[tool.setuptools.packages.find]
include = ["*"]
where = ["src"]

