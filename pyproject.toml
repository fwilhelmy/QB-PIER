[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qb-pier"
version = "0.2.0"
description = "Quantum Benchmarking Pipeline for Integrated Evaluation of Robustness"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Felix Wilhelmy"}
]

[tool.setuptools.packages.find]
where = ["src"]