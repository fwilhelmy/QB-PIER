name: Source release checks
on:
  push:
  pull_request:

jobs:
  static-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependency
        run: python -m pip install pytest
      - name: Check source-only release tree
        run: python scripts/check_public_release.py .
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run dependency-light tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_release_hygiene.py tests/test_configs.py tests/test_project_layout.py tests/test_qdevice_config.py tests/test_analytics_imports.py
